[bar/main]
width = 100%:-60
height = 28
background = ${colors.background}
foreground = ${colors.foreground}
modules-left  = xworkspaces xwindow
modules-right = tray brightness volume xkeyboard settings date
tray-position = right
module-margin = 2
padding-left = 1
padding-right = 1

; для иконок нужен Nerd Font, например ttf-jetbrains-mono-nerd
font-0 = "Hack Nerd Font:size=14;2"
font-1 = "Symbols Nerd Font Mono:size=14;2"

[module/tray]
type = internal/tray
tray-foreground = #ffffff
tray-spacing = 8px

[module/xworkspaces]
type = internal/xworkspaces
enable-click = true

[module/xwindow]
type = internal/xwindow

[module/brightness]
type = custom/script
exec = light -G | cut -d. -f1
interval = 1
label = |󰃟 %output%%|
scroll-up = light -A 5
scroll-down = light -U 5

[module/volume]
type = custom/script
exec = amixer get Master | awk -F'[][]' '/%/ {print $2; exit}'
interval = 1
label = |󰕾 %output%|
click-left = amixer -q set Master toggle
scroll-up = amixer -q set Master 5%+
scroll-down = amixer -q set Master 5%-

[module/xkeyboard]
type = internal/xkeyboard
label-layout = |%{A1:xdotool key super+space:}󰌌 %layout%%{A}|

[module/settings]
type = custom/menu
label-open = [ 󰒓 ]
label-close = [ 󰒓|
menu-0-0 = 󰖩  ]
menu-0-0-exec = kitty -e nmtui
;menu-0-0 = 󰃠 Ярче
;menu-0-0-exec = light -A 10
;menu-0-1 = 󰃞 Темнее
;menu-0-1-exec = light -U 10
;menu-0-2 = 󰌌 Раскладка
;menu-0-2-exec = xdotool key super+space

[module/date]
type = internal/date
;interval = 6
date = %a %d %b
time = %H:%M
label = %time%  %date%

[colors]
background = #1b1b1b
foreground = #ddd6d4

primary = #458588
alert = #cc241d
