# ЧЁРНО-БЕЛАЯ ТЕМА ДЛЯ ВСЕХ РЕЖИМОВ

# 1. Основные настройки
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# 2. Режим копирования
setw -g mode-style 'fg=black bg=white bold'

# 3. Режим часов
setw -g clock-mode-colour white
# setw -g clock-mode-style 'fg=black bg=white bold' #unknown err.

# 4. Статус-бар и окна
set -g status-style 'fg=white bg=black'
setw -g window-status-current-style 'fg=black bg=white bold'
setw -g window-status-style 'fg=colour245 bg=black'

# 5. Панели
set -g pane-border-style 'fg=colour245'
set -g pane-active-border-style 'fg=white'

# 6. Сообщения и уведомления
set -g message-style 'fg=black bg=white bold'
setw -g window-status-bell-style 'fg=black bg=white blink'

# 7. Режим выбора окон/сессий (наследуют основной стиль)
set -g @mode_indicator_custom_prompt " TMUX "
set -g @mode_indicator_empty_prompt " DEFAULT "

# 8. Дополнительные настройки
set -g status-left ''
set -g status-right '%Y-%m-%d %H:%M '

set-window-option -g mode-keys vi  # Включить Vim-режим
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Reduce delay when pressing Escape in Vim
set -sg escape-time 0

# # Или так (более современный вариант)
# set -gq allow-passthrough on
# set -gq focus-events on

set -sa terminal-features ",*:hyperlinks"
